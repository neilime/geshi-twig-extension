name: Shared - Continuous Integration for common tasks
on:
  workflow_call:
    outputs:
      documentation-artifact-id:
        description: Generated PHP API documentation.
        value: ${{ jobs.documentation.outputs.artifact-id }}
permissions: {}
jobs:
  checks:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/continuous-integration.yml@5d4c9035deb6daac5456825c90294439510fdf0c # 1.0.0
    permissions:
      contents: read
      id-token: write
    with:
      php-versions: '["8.2", "8.3", "8.4", "8.5"]'
      ignore-plugins: false
      test: '{"coverage":"codecov"}'
      package: |
        {
          "tests": "php <<'PHP'\n<?php\nrequire 'vendor/autoload.php';\n$twig = new Twig\\Environment(new Twig\\Loader\\ArrayLoader(['test' => '{{ code|geshi(\"php\") }}']));\n$twig->addExtension(new Twig\\Extension\\GeshiExtension());\n$html = $twig->render('test', ['code' => '<?php echo \"hello\";']);\nif (!str_contains($html, 'hello') || !str_contains($html, '<span')) {\n    throw new RuntimeException('The installed Twig filter must load GeSHi language definitions.');\n}\nPHP"
        }
  documentation:
    uses: hoverkraft-tech/ci-github-php/.github/workflows/documentation.yml@5d4c9035deb6daac5456825c90294439510fdf0c # 1.0.0
    permissions:
      contents: read
